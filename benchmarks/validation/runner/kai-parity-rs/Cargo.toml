[package]
name = "kai-parity-rs"
version = "0.1.0"
edition = "2024"
publish = false
description = "Compute-host parity run: the Rust Kai-0.6B contract + ONNX transport against the real quantized export (task #92)."

[dependencies]
opencode-model = { path = "../../../../crates/opencode-model", features = ["tokenizers"] }
opencode-runtime = { path = "../../../../crates/opencode-runtime", features = [
    "runtime-onnx-dynamic",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[workspace]
