# OpenCodifier CI — GitForge (primary CI/CD platform).
#
# GitHub Actions (.github/workflows/) is a mirror only; this file is the
# pipeline of record. Quality gates mirror `just ci` exactly.
#
# All jobs run on the runner-local `opencodifier-ci-rust` image, which bakes
# the toolchain, rustfmt/clippy, cargo-deny, cargo-audit, aegis (pinned
# rev), cargo-llvm-cov + llvm-tools (coverage lane), and a warm crate
# registry. Tools are NOT installed at job runtime:
# the runner's preflight (F25) contract is baked-in-tools, and containers
# here cannot reach host services at all (the host firewall default-DROPs
# docker-sourced traffic; only crates.io-style egress works). Build/rebuild
# the image and bump the tag per the cache contract in
# infrastructure/docker/ci-rust.Dockerfile (`just ci-image`).
#
# Job graph is a fan-out (lint -> {test, doc, supply-chain} -> e2e) unlike
# peers' linear chains: that is safe ONLY because the deployed runner
# executes a run's jobs one at a time (observed: lane finishes are strictly
# serialized in the jobs table; two containers of one run never coexist).
# If the runner ever grows true intra-run parallelism, jobs of one run will
# share the same workspace directory and concurrent cargo invocations will
# corrupt each other's build locks — collapse this to a linear chain the
# same day (the layout GitForge's own pipeline documents).
name: opencodifier-ci
version: "1.0"
trigger_on:
  - push
  - pull_request
environment:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"
jobs:
  - name: lint
    image: opencodifier-ci-rust:2
    timeout: 20m
    steps:
      - name: Format check
        run: cargo fmt --all -- --check
      - name: Clippy (workspace lint contract)
        run: cargo clippy --workspace --all-targets -- -D warnings

  - name: test
    image: opencodifier-ci-rust:2
    needs: [lint]
    # 60m: 2026-10-03 receipts — killed at 43m (old 20m budget, watchdog
    # reconcile) and again at 45m17s under the new budget, both in
    # co-tenant storms at load 95-135. Coverage (strictly heavier:
    # instrumented rebuild + all tests) goes green in ~16 min when calm,
    # so this is contention headroom, not workload growth.
    timeout: 60m
    steps:
      - name: Unit and integration tests
        run: cargo test --workspace
      - name: Documentation tests
        run: cargo test --doc

  - name: doc
    image: opencodifier-ci-rust:2
    needs: [lint]
    # 30m: doc timed out at 15m in the same storm window (2026-10-03).
    timeout: 30m
    steps:
      - name: Build docs with warnings as errors
        run: |
          export RUSTDOCFLAGS="-D warnings"
          cargo doc --workspace --no-deps

  - name: e2e
    image: opencodifier-ci-rust:2
    needs: [test]
    timeout: 30m
    steps:
      - name: Release binary
        run: cargo build --release
      - name: End-to-end validation (serve + MCP, PLAN 18d)
        run: python3 scripts/e2e_validate.py --binary target/release/opencodifier --port 8188

  - name: supply-chain
    image: opencodifier-ci-rust:2
    needs: [lint]
    timeout: 30m
    steps:
      - name: Licenses, advisories, bans, sources
        run: cargo deny check
      - name: Vulnerability audit
        run: cargo audit
      - name: Security pattern scan (0 new findings)
        run: aegis --format json scan --file . --baseline .aegis/baseline.json

  # Coverage floor on the lcov DA basis (the basis docs/COVERAGE.md reports
  # its headline in — 98.97% at the Phase 18 close-out; the 125 waived
  # residual lines carry their reasons there). The floor is a regression
  # guard, deliberately under the 99% aspiration. Queue-cost note: this
  # instrumented rebuild roughly doubles this run's wall time; it stays in
  # the default graph because coverage regressions are exactly the kind of
  # failure that is silent everywhere else.
  - name: coverage
    image: opencodifier-ci-rust:2
    needs: [lint]
    timeout: 45m
    steps:
      - name: Line coverage (lcov DA basis)
        run: cargo llvm-cov --workspace --lcov --output-path /tmp/lcov.info
      - name: Floor assertion (98.5% regression guard)
        run: python3 scripts/coverage_floor.py /tmp/lcov.info --floor 98.5
