[package]
name = "opencode-model"
description = "Model layer for OpenCode: embedding-backed semantic classification, SHA-256-verified model manifests, and the candidate-conditioned inference contract over any InferenceBackend. Softmax and confidence stay in Rust; no weights ship in V1."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
keywords = ["decision", "embedding", "inference", "classifier"]
categories = ["science", "text-processing"]

[lints]
workspace = true

[features]
# The llama.cpp decision rung's HTTP client (D26). The classifier itself
# is transport-agnostic and compiles without the feature — only
# `UreqTransport` pulls the dependency. Plain HTTP on purpose: the
# endpoint is loopback by contract and no TLS stack is wanted here.
llamacpp = ["dep:ureq"]
# Hugging Face `tokenizers` reference encoder for the Kai-0.6B-ONNX
# contract (task #92). The contract module always compiles: rendering,
# pointer math, and score bias are pure Rust over a `KaiTokenizer` trait,
# and the frozen fixtures are reproduced by a built-in byte-level BPE
# oracle (56/56 parts byte-identical to this crate on the frozen set).
# Only this feature pulls the reference encoder itself, for serving and
# for the agreement test that keeps the two encoders honest.
tokenizers = ["dep:tokenizers"]
# The NLI verbalization verifier's serving scorer (PLAN 24j): the
# contract module always compiles; this feature pulls the reference
# tokenizer plus the ONNX runtime the graph runs through. Weights are
# never fetched at build time (D14) — the caller supplies a locally
# verified model directory.
nli = ["dep:tokenizers", "opencode-runtime/onnx"]
# The SigLIP2 zero-shot vision transport (track V, phase G): the
# serving embedder over the split-tower graphs. The contract module
# always compiles; this feature pulls the image decoder, the reference
# tokenizer, and the ONNX runtime the towers run through — but never a
# direct `dep:ort` (D11: the heavyweight runtime is confined to
# opencode-runtime, which the towers ride). Weights are never
# fetched at build time (D14) — the caller supplies a locally verified
# model directory.
vision = ["dep:image", "dep:tokenizers", "opencode-runtime/runtime-onnx-dynamic"]

[dependencies]
opencode-core = { path = "../opencode-core", version = "0.6.0" }
opencode-engine = { path = "../opencode-engine", version = "0.6.0" }
opencode-runtime = { path = "../opencode-runtime", version = "0.6.0" }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
ureq = { version = "2", default-features = false, features = ["json"], optional = true }
# D11 heavyweight dep for this crate (task #92, 2026-10-05): the
# reference encoder behind the `tokenizers` feature only. Pinned to the
# 0.22 line — the same engine the upstream Kai tokenizer.json was built
# with — and bumped only as a deliberate PR that re-runs the fixture
# agreement test.
tokenizers = { version = "0.22", default-features = false, features = ["fancy-regex"], optional = true }
# Image decoding and resizing for the SigLIP2 vision transport (track
# V, phase G). Default features off keeps PNG/JPEG only — no webp, no
# gif, no avif — matching the two media types the IR accepts.
image = { version = "0.25", default-features = false, features = ["png", "jpeg"], optional = true }
