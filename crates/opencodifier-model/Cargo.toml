[package]
name = "opencodifier-model"
description = "Model layer for OpenCodifier: embedding-backed semantic classification, SHA-256-verified model manifests, and the candidate-conditioned inference contract over any InferenceBackend. Softmax and confidence stay in Rust; no weights ship in V1."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
keywords = ["decision", "embedding", "inference", "classifier"]
categories = ["science", "text-processing"]

[lints]
workspace = true

[features]
# The llama.cpp decision rung's HTTP client (D26). The classifier itself
# is transport-agnostic and compiles without the feature — only
# `UreqTransport` pulls the dependency. Plain HTTP on purpose: the
# endpoint is loopback by contract and no TLS stack is wanted here.
llamacpp = ["dep:ureq"]

[dependencies]
opencodifier-core = { path = "../opencodifier-core", version = "0.4.0" }
opencodifier-engine = { path = "../opencodifier-engine", version = "0.4.0" }
opencodifier-runtime = { path = "../opencodifier-runtime", version = "0.4.0" }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
ureq = { version = "2", default-features = false, features = ["json"], optional = true }
