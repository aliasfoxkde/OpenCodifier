[package]
name = "opencodifier-model"
description = "Model layer for OpenCodifier: embedding-backed semantic classification, SHA-256-verified model manifests, and the candidate-conditioned inference contract over any InferenceBackend. Softmax and confidence stay in Rust; no weights ship in V1."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
keywords = ["decision", "embedding", "inference", "classifier"]
categories = ["science", "text-processing"]

[lints]
workspace = true

[features]
# The llama.cpp decision rung's HTTP client (D26). The classifier itself
# is transport-agnostic and compiles without the feature — only
# `UreqTransport` pulls the dependency. Plain HTTP on purpose: the
# endpoint is loopback by contract and no TLS stack is wanted here.
llamacpp = ["dep:ureq"]
# Hugging Face `tokenizers` reference encoder for the Kai-0.6B-ONNX
# contract (task #92). The contract module always compiles: rendering,
# pointer math, and score bias are pure Rust over a `KaiTokenizer` trait,
# and the frozen fixtures are reproduced by a built-in byte-level BPE
# oracle (56/56 parts byte-identical to this crate on the frozen set).
# Only this feature pulls the reference encoder itself, for serving and
# for the agreement test that keeps the two encoders honest.
tokenizers = ["dep:tokenizers"]
# The NLI verbalization verifier's serving scorer (PLAN 24j): the
# contract module always compiles; this feature pulls the reference
# tokenizer plus the ONNX runtime the graph runs through. Weights are
# never fetched at build time (D14) — the caller supplies a locally
# verified model directory.
nli = ["dep:tokenizers", "opencodifier-runtime/onnx"]
# The SigLIP2 zero-shot vision transport (track V, phase F): the
# contract module always compiles; this feature pulls the image decoder,
# the ONNX session, and the SigLIP2 preprocessing math. Weights are
# never fetched at build time (D14); the caller supplies a locally
# verified model directory whose config.json carries the logit_scale.
vision = ["dep:image", "dep:ort", "opencodifier-runtime/onnx"]

[dependencies]
opencodifier-core = { path = "../opencodifier-core", version = "0.6.0" }
opencodifier-engine = { path = "../opencodifier-engine", version = "0.6.0" }
opencodifier-runtime = { path = "../opencodifier-runtime", version = "0.6.0" }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
ureq = { version = "2", default-features = false, features = ["json"], optional = true }
# Image decoding and resizing for the SigLIP2 vision transport (track V,
# phase F). Default-features=false keeps PNG/JPEG only; no webp, gif.
image = { version = "0.25", default-features = false, features = ["png", "jpeg"], optional = true }
# ONNX Runtime for the SigLIP2 vision transport (track V, phase F).
ort = { version = "=2.0.0-rc.13", default-features = false, features = ["std", "ndarray", "api-21", "load-dynamic"], optional = true }
# D11 heavyweight dep for this crate (task #92, 2026-10-05): the
# reference encoder behind the `tokenizers` feature only. Pinned to the
# 0.22 line — the same engine the upstream Kai tokenizer.json was built
# with — and bumped only as a deliberate PR that re-runs the fixture
# agreement test.
tokenizers = { version = "0.22", default-features = false, features = ["fancy-regex"], optional = true }
