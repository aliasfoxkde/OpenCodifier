[package]
name = "opencodifier-core"
description = "Canonical decision IR for OpenCodifier: typed decision questions, candidates, policies, calibrated confidence, and execution traces."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
keywords = ["decision", "classifier", "inference", "routing"]
categories = ["data-structures"]

[lints]
workspace = true

[dependencies]
# D11 note: base64 is the same dependency class as serde/sha2 — small, pure,
# `alloc`-only (wasm-clean). It decodes image payloads at the IR boundary so
# cache keys are a function of the bytes, not the caller's base64 flavor.
base64 = { version = "0.22", default-features = false, features = ["alloc"] }
serde.workspace = true
# Same dependency class as serde itself — the canonical JSON impl for the
# IR's Serialize derives. Core must measure its own serialized sizes
# (EscalationReport::fit_to, the #189 byte budget) so every caller cuts
# identically; keeping the measure inside core is what makes report
# truncation deterministic across transports.
serde_json = "1"
thiserror.workspace = true
