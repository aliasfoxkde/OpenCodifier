[package]
name = "opencode-wasm"
description = "WASM binding for OpenCode: the zero-ML decision runtime (relational solver over BM25) compiled to wasm32-unknown-unknown for browsers and Node. No filesystem, no networking, no telemetry, no dynamic native code."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
keywords = ["decision", "wasm", "webassembly", "deterministic"]
categories = ["wasm", "data-structures"]

[lib]
crate-type = ["cdylib", "rlib"]

[lints]
workspace = true

[dependencies]
opencode-core = { path = "../opencode-core", version = "0.6.0" }
opencode-engine = { path = "../opencode-engine", version = "0.6.0" }
opencode-schema = { path = "../opencode-schema", version = "0.6.0" }
serde_json = "1"
wasm-bindgen = "0.2"
