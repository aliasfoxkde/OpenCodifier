[package]
name = "opencodifier-engine"
description = "Deterministic decision-graph engine for OpenCodifier: DAG executor, rule engine, candidate narrowing, exact-decision cache, and BM25 lexical scoring. No ML, no async runtime, no network."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
keywords = ["decision", "classifier", "rules-engine", "dag", "cache"]
categories = ["data-structures", "algorithms"]

[lints]
workspace = true

[dependencies]
opencodifier-core = { path = "../opencodifier-core", version = "0.4.0" }
opencodifier-runtime = { path = "../opencodifier-runtime", version = "0.4.0" }
serde.workspace = true
serde_json = "1"
sha2.workspace = true
thiserror.workspace = true

# Monotonic time on wasm32 (D23): `std::time::Instant::now()` traps on
# `wasm32-unknown-unknown`, so the `Instant` seam in `clock.rs` reads the
# host clock through `web-time` there. On native targets `web-time` is a
# zero-dependency re-export of `std::time::Instant`, leaving the native
# dependency tree unchanged.
[target.'cfg(target_arch = "wasm32")'.dependencies]
web-time = "1"

[dev-dependencies]
criterion = { version = "0.8", default-features = false }
opencodifier-schema = { path = "../opencodifier-schema", version = "0.4.0" }
proptest = "1"

[[bench]]
name = "engine"
harness = false
