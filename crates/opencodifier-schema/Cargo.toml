[package]
name = "opencodifier-schema"
description = "Wire-format adapters for the OpenCodifier decision IR: native, OpenAI structured outputs, Anthropic tool schemas, and Jev/System One."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
keywords = ["decision", "adapter", "json-schema", "serde"]
categories = ["data-structures", "parser-implementations"]

[lints]
workspace = true

[dependencies]
opencodifier-core = { path = "../opencodifier-core", version = "0.6.0" }
serde.workspace = true
serde_json.workspace = true
# Base64 for image payloads in the Anthropic/OpenAI adapters (D38). The
# engine-side bytes are raw; only the wire dialects encode.
base64 = { version = "0.22", default-features = false, features = ["alloc"] }
# SHA-256 for definition identities (D20), the same primitive D6 uses
# for cache keys.
sha2.workspace = true
thiserror.workspace = true

[dev-dependencies]
proptest = "1"
