[package]
name = "opencode-itemgen"
description = "Deterministic solver-verified relational/contrastive item generator for the E1 decision-model corpus (TRAINING.md §9.7 B3): fact graphs sampled in-process, rendered through the exact extraction grammar, and verified against the relational solver itself."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
keywords = ["decision", "synthetic-data", "test-data", "relational"]
categories = ["development-tools", "algorithms"]

[lints]
workspace = true

[dependencies]
opencode-core = { path = "../opencode-core", version = "0.6.0" }
opencode-engine = { path = "../opencode-engine", version = "0.6.0" }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
sha2 = "0.10"

[[bin]]
name = "opencode-itemgen"
path = "src/main.rs"

[[bin]]
name = "opencode-corpus-merge"
path = "src/bin/corpus_merge.rs"
