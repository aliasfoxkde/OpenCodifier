[package]
name = "opencodifier-wasm"
description = "WASM binding for OpenCodifier: the zero-ML decision runtime (relational solver over BM25) compiled to wasm32-unknown-unknown for browsers and Node. No filesystem, no networking, no telemetry, no dynamic native code."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
keywords = ["decision", "wasm", "webassembly", "deterministic"]
categories = ["wasm", "data-structures"]

[lib]
crate-type = ["cdylib", "rlib"]

[lints]
workspace = true

[dependencies]
opencodifier-core = { path = "../opencodifier-core", version = "0.5.0" }
opencodifier-engine = { path = "../opencodifier-engine", version = "0.5.0" }
opencodifier-schema = { path = "../opencodifier-schema", version = "0.5.0" }
serde_json = "1"
wasm-bindgen = "0.2"
