[package]
name = "opencodifier-cli"
description = "Command-line interface for the OpenCodifier decision runtime"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[[bin]]
name = "opencodifier"
path = "src/main.rs"

[dependencies]
opencodifier-core = { path = "../opencodifier-core", version = "0.1.0" }
opencodifier-engine = { path = "../opencodifier-engine", version = "0.1.0" }
opencodifier-model = { path = "../opencodifier-model", version = "0.1.0" }
opencodifier-schema = { path = "../opencodifier-schema", version = "0.1.0" }
opencodifier-http = { path = "../opencodifier-http", version = "0.1.0" }
clap = { version = "4", features = ["derive"] }
serde.workspace = true
serde_json.workspace = true
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
# Digests for the `models verify` fixtures: the tests pin real artifact
# bytes with the same SHA-256 the manifest carries.
sha2.workspace = true

[lints]
workspace = true
