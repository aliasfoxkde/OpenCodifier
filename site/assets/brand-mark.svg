<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <!-- OpenCodifier nav mark. The canonical logo geometry
       (docs/images/OpenCodifier_Logo.svg, apg-1/apg-2) is drawn for large
       surfaces; scaled to the 22 px nav slot its hairline hexagon and
       fine code glyph turn to mush. This is the same identity redrawn for
       small sizes: a bold hexagonal ring (pointy-top, ~80-unit wall) with
       a chunky right-chevron code glyph in the counter, no interior
       detail below the legibility floor. Canonical gradient kept. -->
  <defs>
    <linearGradient id="ocg" x1="0.258" y1="0.063" x2="0.742" y2="0.937">
      <stop offset="0%" stop-color="#728ee4"/>
      <stop offset="100%" stop-color="#3a00ad"/>
    </linearGradient>
  </defs>
  <path fill-rule="evenodd" fill="url(#ocg)" d="
    M256 26 L455.3 141 L455.3 371 L256 486 L56.7 371 L56.7 141 Z
    M256 116 L381.9 188.5 L381.9 323.5 L256 396 L130.1 323.5 L130.1 188.5 Z"/>
  <path fill="url(#ocg)" d="
    M196 189 L217.8 176.4 L292 220 L292 246 L217.8 289.6 L196 277 L196 251.2
    L259.5 233 L196 214.8 Z
    M220 300 L294 300 L294 326 L220 326 Z"/>
</svg>
